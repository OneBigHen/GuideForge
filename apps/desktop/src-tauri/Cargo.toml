[package]
name = "guideforge-desktop"
version = "0.1.0"
description = "GuideForge desktop shell (thin Tauri 2 wrapper over apps/web)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "guideforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
