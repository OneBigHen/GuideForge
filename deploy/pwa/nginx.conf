# Include this server fragment in the HTTPS static host serving apps/web/dist.
# Companion APIs must be reverse-proxied under the same origin or added to the
# connect-src directive explicitly.

location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /sw.js {
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header Service-Worker-Allowed "/" always;
}

location = /manifest.webmanifest {
  add_header Cache-Control "no-cache" always;
}

location ^~ /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
  try_files $uri $uri/ /index.html;
}

# Apply these at server scope when the fragment is included inside a server.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
