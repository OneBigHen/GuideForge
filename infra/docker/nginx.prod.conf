# Production same-origin seam for guides.henning.rodeo.
# Mounted read-only by docker-compose.prod.yml (web service).
#
# Contract:
#   - `/` serves the PWA; `/api/` and `/collab/` are proxied internally.
#   - Security headers ship on every response; CSP is built from the app's
#     real needs (Turnstile widget, blob: workers, WebGL assets) — not copied.
#   - Body limits are per-route and intentionally small.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- security headers (every response) -----------------------------------
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  # Turnstile needs its challenge frame + scripts; workers/WebGL need
  # worker-src blob:; media/models load from same-origin blobs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; child-src 'self' blob: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm model/gltf-binary;

  client_max_body_size 1m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Immutable hashed assets, if present.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker must not be cached so updates are picked up.
  location = /sw.js {
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /api/ {
    # Owner AI/synthesis payloads stay small; imports use draft packages.
    client_max_body_size 2m;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location /collab/ {
    proxy_pass http://collab:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }
}
