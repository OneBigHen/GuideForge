# Production same-origin seam for guides.henning.rodeo.
# Mounted read-only by docker-compose.prod.yml (web service).
#
# Contract:
#   - `/` serves the PWA; `/api/` and `/collab/` are proxied internally.
#   - Security headers ship on every response; CSP is built from the app's
#     real needs (Turnstile widget, blob: workers, WebGL assets) — not copied.
#   - Body limits are per-route and intentionally small.

map $http_cf_connecting_ip $guideforge_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

limit_req_zone $guideforge_client_ip zone=guideforge_demo:10m rate=10r/m;
limit_req_zone $guideforge_client_ip zone=guideforge_auth:10m rate=10r/m;
limit_req_status 429;

log_format guideforge '$guideforge_client_ip - - [$time_local] "$request" $status '
  '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log guideforge;

  # --- security headers (every response) -----------------------------------
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  # Keep the edge from rewriting HTML with untrusted telemetry/bot snippets;
  # Turnstile remains explicit in the app where its CSP allowances are known.
  add_header Cache-Control "no-transform" always;
  # Turnstile needs its challenge frame + scripts; workers/WebGL need
  # worker-src blob:; media/models load from same-origin blobs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; child-src 'self' blob: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm model/gltf-binary;

  client_max_body_size 1m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # `/assets` is a legacy owner link. Redirect it to the Access-protected
  # `/asset-manager` route without claiming the hashed static files below.
  location = /assets {
    return 302 https://guides.henning.rodeo/asset-manager;
  }

  # Immutable hashed assets, if present.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker must not be cached so updates are picked up.
  location = /sw.js {
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 10s;
  }

  location = /api/health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 10s;
  }

  location = /api/session {
    limit_req zone=guideforge_auth burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }

  location ^~ /api/demo/ {
    limit_req zone=guideforge_demo burst=3 nodelay;
    client_max_body_size 64k;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location /api/ {
    # Owner AI/synthesis payloads stay small; imports use draft packages.
    client_max_body_size 2m;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location /collab/ {
    proxy_pass http://collab:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }
}
