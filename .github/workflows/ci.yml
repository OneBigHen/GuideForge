name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/single-user-ai-studio]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Integration tests (apps/api) connect to the Postgres service below.
  DATABASE_URL: postgres://guideforge:guideforge@localhost:5432/guideforge

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guideforge
          POSTGRES_PASSWORD: guideforge
          POSTGRES_DB: guideforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guideforge -d guideforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Standalone binary install; reads the exact version from
          # package.json packageManager. Avoids the npm self-installer,
          # which fails on shared-runner pnpm-store cache permissions.
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (Postgres service provided)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary check
        run: pnpm boundary

      - name: Dependency check
        run: pnpm dep-check

      - name: Policy script tests
        run: pnpm security:policy-test

      - name: Secret scan (gitleaks, regex fallback)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scan fallback (no gitleaks)
        if: failure()
        run: pnpm security:secret-scan

      # Supply-chain gates. Per docs/security/supply-chain-policy.md these are
      # blocking: a failure is a red build unless recorded in
      # docs/security/reviewed-exceptions.json. No `|| true` suppression.
      - name: Dependency audit (policy-gated)
        run: pnpm security:audit

      - name: License policy (policy-gated)
        run: pnpm security:licenses

      - name: SBOM (blocking generation)
        run: pnpm security:sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: error

  e2e:
    name: e2e (Playwright, desktop + iPad + iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Standalone binary install; reads the exact version from
          # package.json packageManager. Avoids the npm self-installer,
          # which fails on shared-runner pnpm-store cache permissions.
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium + WebKit)
        run: pnpm --filter @guideforge/web exec playwright install --with-deps chromium webkit

      - name: Run Playwright E2E
        run: pnpm --filter @guideforge/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
